<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>404 – Page not found | Stackly Sports Club</title>
<meta name="description" content="The page you are looking for could not be found. Go back or return to the Stackly Sports Club home page." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#111111" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ==========================================================
   Stackly Sports Club — 404 (uses the site's tokens + animations)
   ========================================================== */
:root{--cream:#f6f1ea;--soft:#fffbf5;--sand:#ede4d8;--ink:#111111;--red:#e10600;--gold:#ffc21a;--h:"Anton",Impact,"Arial Narrow",sans-serif;--b:"Manrope",system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:var(--b);font-weight:500;background:var(--ink);color:var(--cream);line-height:1.6;overflow-x:hidden;animation:fade .6s ease both}
body.leave{opacity:0;transition:opacity .28s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1{font-family:var(--h);font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{width:min(92%,1200px);margin-inline:auto}

/* ----- the site's keyframes (same names + timing as the other pages) ----- */
@keyframes fade{from{opacity:0}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes up{to{transform:none}}
@keyframes fl{50%{transform:translateY(-12px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes zoom{to{transform:scale(1)}}
@keyframes load{to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bb{0%{transform:translateY(-50px);animation-timing-function:cubic-bezier(.55,0,1,.45)}50%{transform:translateY(0);animation-timing-function:cubic-bezier(0,.55,.45,1)}100%{transform:translateY(-50px)}}
@keyframes bsq{0%,45%{transform:scale(1,1)}50%{transform:scale(1.2,.78)}55%,100%{transform:scale(1,1)}}
@keyframes bsh{0%,100%{transform:scale(.55);opacity:.12}50%{transform:scale(1);opacity:.5}}

/* red progress bar (same as the site's #bar) */
#bar{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--red);transform:scaleX(0);transform-origin:left;z-index:100;animation:load 1.1s var(--ease) .1s forwards}

/* buttons (same pill style as the site) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:999px;font:800 .95rem var(--b);letter-spacing:.02em;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--cream);transition:transform .25s,background .25s,color .25s}
.btn:hover{transform:translateY(-3px)}
.btn svg{transition:transform .3s}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn.gold:hover{background:var(--soft)}
.btn.gold:hover svg{transform:translateX(4px)}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--cream)}
.btn.ghost:hover{background:var(--cream);color:var(--ink)}
.btn.ghost:hover svg{transform:translateX(-4px)}

/* ---------- 404 page (hero style = .phero on the inner pages) ---------- */
.e404{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;overflow:hidden;padding:clamp(2rem,6vh,4rem) 0;color:var(--cream)}
.e404 .ph{position:absolute;inset:-8% 0;z-index:0;background:#111;overflow:hidden}
.e404 .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45;transform:scale(1.12);animation:zoom 2.4s var(--ease) forwards}
.e404::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(60% 55% at 85% 8%,rgba(255,194,26,.22),transparent 70%),radial-gradient(55% 60% at 8% 92%,rgba(225,6,0,.3),transparent 70%),linear-gradient(0deg,rgba(17,17,17,.92),rgba(17,17,17,.74) 60%,rgba(17,17,17,.62))}
.e404 .wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.tag{display:inline-block;background:rgba(246,241,234,.08);color:var(--gold);padding:6px 18px;border-radius:999px;font-weight:800;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.6rem;border:1px solid rgba(255,194,26,.4);animation:pop .5s var(--ease) both}
.e404-num{display:flex;align-items:center;justify-content:center;gap:.04em;font-family:var(--h);font-size:clamp(5.5rem,24vw,13rem);line-height:1;color:var(--cream);letter-spacing:-.02em;margin:.1em 0 .18em;user-select:none;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.e404-num>span{display:block;transform:translateY(110%);opacity:0;animation:up .9s var(--ease) .1s forwards,show .9s .1s forwards}
.e404-num>span:last-child{animation-delay:.25s}
.e404-seal{height:.8em;width:auto;overflow:visible;flex:none;animation:pop .8s .2s both,fl 8s ease-in-out 1s infinite}
.e404-seal .spin{transform-origin:100px 100px;animation:spin 30s linear infinite}
.e404-seal .bounce{animation:bb 1.3s infinite}
.e404-seal .squash{transform-origin:100px 146px;animation:bsq 1.3s infinite}
.e404-seal .bspin{transform-origin:100px 120px;animation:spin 1.3s linear infinite}
.e404-seal .bshadow{transform-origin:100px 150px;animation:bsh 1.3s infinite}
/* heading reveals line by line, like the page heroes */
.e404 h1{font-size:clamp(1.9rem,5vw,3.2rem);max-width:24ch;margin-bottom:1rem;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.e404 h1 span{display:block;overflow:hidden}
.e404 h1 b{display:inline-block;font-weight:400;transform:translateY(110%);animation:up .9s var(--ease) .1s forwards}
.e404 h1 span:nth-child(2) b{animation-delay:.25s}
.e404 h1 i{color:var(--gold)}
.e404 p.lead{max-width:52ch;margin-bottom:2rem;color:#e6e1d8;font-weight:600;opacity:0;animation:show .8s .7s forwards}
.e404 .btn-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;opacity:0;animation:show .8s .9s forwards}
@media (max-width:600px){
  .e404 .btn-row{flex-direction:column;align-items:stretch;width:100%;max-width:340px}
  .e404 .btn{width:100%}
  .e404 p.lead{margin-bottom:1.6rem}
}
@media (max-width:380px){.e404-num{font-size:clamp(4.6rem,25vw,5.5rem)}}
@media (max-height:560px) and (orientation:landscape){
  .e404{min-height:auto;padding:1.5rem 0}
  .e404-num{font-size:clamp(4rem,16vh,6.5rem);margin:.05em 0 .1em}
  .e404 h1{font-size:1.6rem;margin-bottom:.6rem}
  .e404 p.lead{margin-bottom:1.2rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #bar{transform:scaleX(1)}
  .e404-num>span,.e404 h1 b{transform:none;opacity:1}
  .e404 p.lead,.e404 .btn-row{opacity:1}
  .e404 .ph img{transform:none}
}
</style>
</head>
<body>
<div id="bar"></div>
<main id="main">
<section class="e404">
  <div class="ph">
    <img src="https://images.unsplash.com/photo-1489944440615-453fc2b6a9a9?auto=format&fit=crop&w=1800&q=70" alt="" decoding="async" />
  </div>
  <div class="wrap">
    <span class="tag">Error 404</span>
    <div class="e404-num" aria-hidden="true"><span>4</span><svg class="e404-seal" viewBox="0 0 200 200" role="img" aria-label="0">      <circle cx="100" cy="100" r="92" fill="none" stroke="#f6f1ea" stroke-width="8"/>
      <g class="spin"><circle cx="100" cy="100" r="76" fill="none" stroke="#ffc21a" stroke-width="4" stroke-dasharray="3 11" stroke-linecap="round"/></g>
      <ellipse class="bshadow" cx="100" cy="150" rx="24" ry="4.5" fill="#000"/>
      <g class="bounce"><g class="squash"><g class="bspin">
        <defs><clipPath id="bclip"><circle cx="100" cy="120" r="26"/></clipPath></defs>
        <circle cx="100" cy="120" r="26" fill="#e8731a"/>
        <g clip-path="url(#bclip)" stroke="#1a1a1a" stroke-width="2.4" fill="none" stroke-linecap="round">
          <path d="M100 94v52M74 120h52"/>
          <path d="M80 98q14 22 0 44M120 98q-14 22 0 44"/>
        </g>
        <circle cx="100" cy="120" r="26" fill="none" stroke="#1a1a1a" stroke-width="2.4"/>
      </g>
      <ellipse cx="91" cy="108" rx="7" ry="4" fill="#fff" opacity=".22" transform="rotate(-35 91 108)"/>
      </g></g>
    </svg><span>4</span></div>
    <h1><span><b>We could not find</b></span><span><b>that <i>page</i></b></span></h1>
    <p class="lead">The page you are looking for may have moved, been renamed or never existed. Go back to where you were, or head to the home page to find the program or service you need.</p>
    <div class="btn-row">
      <button type="button" class="btn ghost back" id="goBack"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Go back</span></button>
      <a class="btn gold" href="index.html"><span>Back to home</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </div>
</section>
</main>

<script>
(function(){
  /* page-leave fade, same as the other pages */
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href]');
    if(!a||a.target||e.metaKey||e.ctrlKey||e.shiftKey)return;
    var h=a.getAttribute('href');
    if(!h||h.charAt(0)==='#'||/^(https?:|mailto:|tel:)/.test(h))return;
    e.preventDefault();document.body.classList.add('leave');
    setTimeout(function(){window.location.href=h},280);
  });
  /* go back to the previous page and restore its scroll position */
  try{if('scrollRestoration' in history)history.scrollRestoration='auto'}catch(_){}
  var b=document.getElementById('goBack');
  if(!b)return;
  b.addEventListener('click',function(){
    if(window.history.length>1){
      window.history.back();
      setTimeout(function(){if(!document.hidden)window.location.href='index.html'},700);
    }else{window.location.href='index.html'}
  });
})();
</script>
</body>
</html>
